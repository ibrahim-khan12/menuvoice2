workflows:
  ios-build:
    name: iOS build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: meetmymenu apple codemagic ci
    environment:
      node: 22
      groups:
        - ios-google-oauth
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meetmymenu.app
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      - name: Add and sync the iOS platform
        script: |
          set -e
          npx cap add ios
          npx cap sync ios

      - name: Add required Info.plist entries
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          plutil -replace NSCameraUsageDescription -string \
            "Meet My Menu uses the camera to photograph restaurant menus so they can be read aloud." "$PLIST"
          plutil -replace NSMicrophoneUsageDescription -string \
            "Meet My Menu uses the microphone for voice commands and questions about the menu." "$PLIST"
          plutil -insert CFBundleURLTypes -json '[{"CFBundleURLSchemes":["com.meetmymenu.app"]}]' "$PLIST"
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$PLIST"

      - name: Set the build number
        script: |
          set -e
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "Using build number: $BUILD_NUMBER"
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      # Xcode regenerates Info.plist from build settings at archive time
      # (GENERATE_INFOPLIST_FILE), the same mechanism that drops
      # CFBundleVersion if it isn't set as a build setting too — camera/mic
      # never prompted for permission on a real device because
      # NSCameraUsageDescription and NSMicrophoneUsageDescription weren't
      # actually surviving into the built app. INFOPLIST_KEY_* build
      # settings are the Apple-documented way to set these for a generated
      # Info.plist, so an xcconfig is more reliable here than editing the
      # plist file directly (which the step above still does, harmlessly,
      # as a fallback).
      - name: Build the .ipa
        script: |
          set -e
          cat > ios/App/permissions.xcconfig << 'XCCONFIG'
          INFOPLIST_KEY_NSCameraUsageDescription = Meet My Menu uses the camera to photograph restaurant menus so they can be read aloud.
          INFOPLIST_KEY_NSMicrophoneUsageDescription = Meet My Menu uses the microphone for voice commands and questions about the menu.
          XCCONFIG
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-xcargs "-xcconfig ios/App/permissions.xcconfig"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
