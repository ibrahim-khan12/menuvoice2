workflows:
  ios-build:
    name: iOS build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: meetmymenu apple codemagic ci
    environment:
      node: 22
      vars:
        VITE_GOOGLE_CLIENT_ID: $VITE_GOOGLE_CLIENT_ID
        VITE_OPENAI_API_KEY: $VITE_OPENAI_API_KEY
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meetmymenu.app
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      # ios/ isn't committed to the repo (it's Xcode-generated and this team
      # has no Mac to generate it locally), so every build creates it fresh.
      # Capacitor 8's default template uses Swift Package Manager, not
      # CocoaPods (it writes ios/App/CapApp-SPM/Package.swift, no Podfile,
      # no .xcworkspace) so there's nothing to `pod install` here.
      - name: Add and sync the iOS platform
        script: |
          set -e
          npx cap add ios
          npx cap sync ios

      - name: Add required Info.plist entries
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          plutil -replace NSCameraUsageDescription -string \
            "Meet My Menu uses the camera to photograph restaurant menus so they can be read aloud." "$PLIST"
          plutil -replace NSMicrophoneUsageDescription -string \
            "Meet My Menu uses the microphone for voice commands and questions about the menu." "$PLIST"
          plutil -insert CFBundleURLTypes -json '[{"CFBundleURLSchemes":["com.meetmymenu.app"]}]' "$PLIST"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      # ios/ is regenerated from scratch every build, so its bundle version
      # always starts back at 1 — TestFlight rejects that as a duplicate of
      # whatever was uploaded last time. Codemagic's auto-incrementing build
      # number keeps every upload's version unique.
      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$CM_BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
