workflows:
  ios-build:
    name: iOS build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      vars:
        VITE_GOOGLE_CLIENT_ID: $VITE_GOOGLE_CLIENT_ID
        VITE_OPENAI_API_KEY: $VITE_OPENAI_API_KEY
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meetmymenu.app
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      # ios/ isn't committed to the repo (it's Xcode/CocoaPods-generated and
      # this team has no Mac to generate it locally), so every build creates
      # it fresh and re-applies the plist edits below.
      - name: Add and sync the iOS platform
        script: |
          set -e
          npx cap add ios
          npx cap sync ios
          echo "--- ios/App contents ---"
          ls -la ios/App

      # cap sync normally runs `pod install` itself, but the generated
      # App.xcworkspace only exists once CocoaPods has actually run, and
      # that step has silently no-opped before, so run it explicitly too.
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios/App
          pod install

      - name: Add required Info.plist entries
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          plutil -replace NSCameraUsageDescription -string \
            "Meet My Menu uses the camera to photograph restaurant menus so they can be read aloud." "$PLIST"
          plutil -replace NSMicrophoneUsageDescription -string \
            "Meet My Menu uses the microphone for voice commands and questions about the menu." "$PLIST"
          plutil -insert CFBundleURLTypes -json '[{"CFBundleURLSchemes":["com.meetmymenu.app"]}]' "$PLIST"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa

    # TestFlight publishing needs an App Store Connect integration added in
    # Codemagic's Team settings first (Integrations -> App Store Connect).
    # Once that's set up, add back:
    #
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true
