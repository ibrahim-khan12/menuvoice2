workflows:
  ios-build:
    name: iOS build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: meetmymenu apple codemagic ci
    environment:
      node: 22
      groups:
        - ios-google-oauth
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meetmymenu.app
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      - name: Add, brand, and sync the iOS platform
        script: |
          set -e
          npx cap add ios
          npx @capacitor/assets generate --ios
          npx cap sync ios

      - name: Add required Info.plist entries
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          plutil -replace NSCameraUsageDescription -string \
            "Meet My Menu uses the camera to photograph restaurant menus so they can be read aloud." "$PLIST"
          plutil -replace NSMicrophoneUsageDescription -string \
            "Meet My Menu uses the microphone for voice commands and questions about the menu." "$PLIST"
          plutil -insert CFBundleURLTypes -json '[{"CFBundleURLSchemes":["com.meetmymenu.app"]}]' "$PLIST"
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$PLIST"

      - name: Set the build number
        script: |
          set -e
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "Using build number: $BUILD_NUMBER"
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      # A prior attempt set these via `-xcconfig` through --archive-xcargs,
      # but the real device build still never prompted for camera/mic
      # access afterward — there's no proof that flag was actually honored
      # by the xcode-project wrapper, only that the build didn't error.
      # Editing project.pbxproj directly (via the xcodeproj gem) can't be
      # silently dropped by an intermediate tool the way a CLI flag can:
      # this writes INFOPLIST_KEY_NSCameraUsageDescription /
      # INFOPLIST_KEY_NSMicrophoneUsageDescription onto every build
      # configuration of every target, which is what GENERATE_INFOPLIST_FILE
      # actually reads from when it synthesizes Info.plist at archive time.
      - name: Set iOS permission strings as build settings
        script: |
          set -e
          gem list -i xcodeproj > /dev/null || gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["INFOPLIST_KEY_NSCameraUsageDescription"] =
                  "Meet My Menu uses the camera to photograph restaurant menus so they can be read aloud."
                config.build_settings["INFOPLIST_KEY_NSMicrophoneUsageDescription"] =
                  "Meet My Menu uses the microphone for voice commands and questions about the menu."
              end
            end
            project.save
          '

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"

      # Read back the actual shipped Info.plist instead of assuming the step
      # above worked — this is the only way to get real proof, since a
      # green build here doesn't mean the keys made it into the binary
      # (that's exactly how the previous, silently-ineffective fix looked
      # too).
      - name: Verify permission strings made it into the built app
        script: |
          set -e
          cd build/ios/ipa
          unzip -o -q App.ipa -d _inspect
          echo "--- Final Info.plist: camera/mic/URL keys ---"
          plutil -extract NSCameraUsageDescription raw _inspect/Payload/*.app/Info.plist
          plutil -extract NSMicrophoneUsageDescription raw _inspect/Payload/*.app/Info.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
